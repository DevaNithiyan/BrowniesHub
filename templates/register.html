{% extends "base.html" %}

{% block title %}Create an Account | Brownies Hub{% endblock %}

{% block content %}

<div class="container">
    <div class="auth-wrapper">
        <div class="auth-header">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Brownies Hub Logo" style="width: 72px; height: 72px; border-radius: 50%; box-shadow: 0 4px 12px rgba(99, 51, 17, 0.15); margin-bottom: 0.75rem;">
            <h2>Join Brownies Hub</h2>
            <p>Create your bakery account to unlock easy ordering and order tracking.</p>
        </div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label class="form-label" for="regName">Full Name *</label>
                <input type="text" 
                       id="regName" 
                       class="form-control" 
                       placeholder="e.g. Rahul Sharma" 
                       required>
            </div>

            <div class="form-group">
                <label class="form-label" for="regEmail">Email Address *</label>
                <input type="email" 
                       id="regEmail" 
                       class="form-control" 
                       placeholder="e.g. rahul@example.com" 
                       required>
            </div>

            <div class="form-group">
                <label class="form-label" for="regPassword">Password * (Min. 6 characters)</label>
                <input type="password" 
                       id="regPassword" 
                       class="form-control" 
                       placeholder="Create a secure password" 
                       minlength="6" 
                       required>
            </div>

            <div class="form-group">
                <label class="form-label" for="regConfirmPassword">Confirm Password *</label>
                <input type="password" 
                       id="regConfirmPassword" 
                       class="form-control" 
                       placeholder="Re-enter your password" 
                       minlength="6" 
                       required>
            </div>

            <button type="submit" id="registerBtn" class="btn btn-primary btn-block" style="padding: 0.85rem; font-size: 1rem; margin-top: 1.5rem;">
                Create Account &rarr;
            </button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="{{ url_for('login_page') }}">Log In</a>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
async function handleRegister(e) {
    e.preventDefault();
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const confirmPassword = document.getElementById('regConfirmPassword').value;
    const btn = document.getElementById('registerBtn');

    if (password !== confirmPassword) {
        showToast('Passwords do not match. Please re-check.', 'danger');
        return;
    }

    btn.disabled = true;
    btn.innerHTML = 'Creating Account... ⏳';

    try {
        const response = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password })
        });

        const result = await response.json();
        if (result.success) {
            showToast(result.message || 'Account created successfully!', 'success');
            setTimeout(() => {
                window.location.href = '/products';
            }, 600);
        } else {
            showToast(result.message || 'Registration failed.', 'danger');
            btn.disabled = false;
            btn.innerHTML = 'Create Account &rarr;';
        }
    } catch (err) {
        console.error('Registration error:', err);
        showToast('Server connection error. Please try again.', 'danger');
        btn.disabled = false;
        btn.innerHTML = 'Create Account &rarr;';
    }
}
</script>
{% endblock %}
